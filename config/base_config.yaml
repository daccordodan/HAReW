# Configuration for the BASELINE SHARP reproduction.
# Extension tasks use their own separate config files.

project:
  name: "wifi-har-sharp-baseline"
  description: "Baseline SHARP reproduction (PyTorch), 5-class task: E, W, R, J, L"

paths:
  doppler_traces_dir: "data/doppler_traces"
  baseline_output_dir: "outputs/baseline"
  colab_drive_subpath: null
  colab_drive_output_subpath: null

hardware:
  n_antennas: 4                # Nant -- Asus RT-AC86U monitor

doppler:
  stacked_vectors_nw: 340       # Nw -- window length fed to the classifier
  velocity_bins_nd: 100          # ND -- verified against real uploaded files (shape[1]==100)
  window_stride: 30           # null = non-overlapping windows (stride=Nw); set < Nw to oversample short recordings (e.g. jumping)

model:
  n_classes_primary: 5          # E, W, R, J, L -- see src/data/label_mapping.py
  dropout_rate: 0.2
  reference_param_count: 128535

training:
  batch_size: 16                 # per-window batches
  learning_rate: 0.001
  epochs: 25
  train_split: 0.6               # of S1 only
  val_split: 0.2                 # of S1 only (remaining 0.2 = held-out S1 test)

evaluation:
  test_sets: ["S1", "S2", "S3", "S4", "S5", "S6", "S7"]
  s7_reference_accuracy: 0.9599  # Paper 2, Table 3

seed: 42

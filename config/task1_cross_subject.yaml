# Configuration for Task 1: Cross-subject generalization
# (contrastive / self-supervised learning), kept fully separate from
# config/base_config.yaml per project constraint #3.

project:
  name: "wifi-har-sharp-task1-cross-subject"
  description: "Contrastive pretraining for subject-invariant Doppler-trace representations"

paths:
  doppler_traces_dir: "data/doppler_traces"          # same raw data source as baseline
  baseline_checkpoint: "outputs/baseline/checkpoints/sharp_baseline_best.pt"  # read-only reference, not modified
  task_output_dir: "outputs/task1_cross_subject"
  colab_drive_subpath: null
  colab_drive_output_subpath: null

doppler:
  stacked_vectors_nw: 340       # Nw -- window length fed to the classifier
  velocity_bins_nd: 100          # ND -- verified against real uploaded files (shape[1]==100)
  window_stride: 30          # null = non-overlapping windows (stride=Nw); set < Nw to oversample short recordings (e.g. jumping)

hardware:
  n_antennas: 4                # Physical monitor antennas in the recordings

local_hardware:                # Local GPU parameters
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  torch_num_threads: 8
  torch_num_interop_threads: 2

training:
  batch_size: 16                 # per-window batches
  learning_rate: 0.001
  epochs: 50
  train_split: 0.6
  val_split: 0.2
  pretraining_epochs: 100
  finetune_epochs: 20

model:
  n_classes_primary: 5          # E, W, R, J, L -- see src/data/label_mapping.py
  dropout_rate: 0.2
  reference_param_count: 128535

contrastive:
  projection_dim: 64             # placeholder -- to be tuned during extension phase
  temperature: 0.1                # SimCLR-style contrastive temperature (placeholder)
  augmentations: []                # TODO: define Doppler-trace-appropriate augmentations

seed: 42

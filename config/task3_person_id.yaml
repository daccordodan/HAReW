# Configuration for Task 3: Person identification,
# kept fully separate from config/base_config.yaml per project constraint #3.

project:
  name: "wifi-har-sharp-task3-person-id"
  description: "Person-identification head over Doppler-trace features"

paths:
  doppler_traces_dir: "data/doppler_traces"
  task1_encoder_checkpoint: null   # optional: reuse Task 1's pretrained encoder, once available
  task_output_dir: "outputs/task3_person_id"
  colab_drive_subpath: null
  colab_drive_output_subpath: null

model:
  n_people: 3

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 30

seed: 42
